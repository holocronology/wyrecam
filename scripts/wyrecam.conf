# WyreCam install settings
#
# Edit this file on the SD card before installing. Use single quotes around
# each value. If a value itself contains a single quote, write it as '\''
#
# The installer DELETES this file from the SD card after a successful install,
# so your Wi-Fi password does not stay on the card.

# Wi-Fi network name and password (leave the password empty for an open network).
WIFI_SSID=''
WIFI_PASSWORD=''

# Root password for the serial console and SSH.
# Leave empty to lock root logins entirely (recommended unless you need them).
ROOT_PASSWORD=''

# SSH is off unless you set ENABLE_SSH='yes'.
# If you add a public key (one line, e.g. 'ssh-ed25519 AAAA... you@host'),
# SSH accepts that key only and refuses passwords. Without a key, SSH uses
# ROOT_PASSWORD, which then must not be empty.
ENABLE_SSH='no'
SSH_AUTHORIZED_KEY=''
